syntax = "proto3";

package meta;

// ============================================================================
// Meta Service - Raft-based coordination for MynaDB cluster
// ============================================================================

service MetaService {
    // Node management
    rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    rpc DeregisterNode(DeregisterNodeRequest) returns (DeregisterNodeResponse);
    rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

    // =========================================================================
    // Table-Level Routing (Multi-Node Support)
    // =========================================================================
    // Table-level routing where tables can have multiple owner nodes for:
    // - Write reroute: When primary fails, writes go to fallback node
    // - Large table distribution: Future feature to spread data across nodes
    // Queries use scatter-gather to all owner nodes for complete results.

    rpc RegisterTable(RegisterTableRequest) returns (RegisterTableResponse);
    rpc AddTableOwner(AddTableOwnerRequest) returns (AddTableOwnerResponse);
    rpc RemoveTableOwner(RemoveTableOwnerRequest) returns (RemoveTableOwnerResponse);
    rpc UpdateTableStats(UpdateTableStatsRequest) returns (UpdateTableStatsResponse);
    rpc ReassignTable(ReassignTableRequest) returns (ReassignTableResponse);
    rpc RemoveTable(RemoveTableRequest) returns (RemoveTableResponse);
    rpc GetTableOwner(GetTableOwnerRequest) returns (GetTableOwnerResponse);
    rpc ListTablesForNode(ListTablesForNodeRequest) returns (ListTablesForNodeResponse);
    rpc ListTables(ListTablesRequest) returns (ListTablesResponse);

    // =========================================================================
    // Write Distribution Configuration
    // =========================================================================
    // Configures how writes are distributed across primary nodes for load balancing.
    // percent=0 means single node (default), percent=100 means all nodes.

    rpc SetDistributionConfig(SetDistributionConfigRequest) returns (SetDistributionConfigResponse);
    rpc DeleteDistributionConfig(DeleteDistributionConfigRequest) returns (DeleteDistributionConfigResponse);
    rpc GetDistributionConfig(GetDistributionConfigRequest) returns (GetDistributionConfigResponse);
    rpc GetEffectiveDistributionConfig(GetEffectiveDistributionConfigRequest) returns (GetEffectiveDistributionConfigResponse);
    rpc ListDistributionConfigs(ListDistributionConfigsRequest) returns (ListDistributionConfigsResponse);

    // Distributed locks (atomic CAS with fencing tokens)
    rpc TryLock(TryLockRequest) returns (TryLockResponse);
    rpc Unlock(UnlockRequest) returns (UnlockResponse);
    rpc RenewLock(RenewLockRequest) returns (RenewLockResponse);
    rpc GetLock(GetLockRequest) returns (GetLockResponse);

    // Leader election
    rpc Campaign(CampaignRequest) returns (CampaignResponse);
    rpc Resign(ResignRequest) returns (ResignResponse);
    rpc GetLeader(GetLeaderRequest) returns (GetLeaderResponse);

    // Events (streaming with sequence numbers)
    rpc Subscribe(SubscribeRequest) returns (stream Event);
    rpc Publish(PublishRequest) returns (PublishResponse);

    // Cluster status
    rpc GetClusterStatus(GetClusterStatusRequest) returns (GetClusterStatusResponse);
    rpc GetRaftStatus(GetRaftStatusRequest) returns (GetRaftStatusResponse);

    // Data Node Mode Management (Cold Standby Architecture)
    // Note: No promotion RPCs - using No-Promotion architecture
    // Standby nodes never promote to Primary; K8s handles node replacement
    rpc GetDataNodeMode(GetDataNodeModeRequest) returns (GetDataNodeModeResponse);

    // Scale-In (Retirement) Operations
    rpc StartRetire(StartRetireRequest) returns (StartRetireResponse);
    rpc CompleteRetire(CompleteRetireRequest) returns (CompleteRetireResponse);
    rpc CancelRetire(CancelRetireRequest) returns (CancelRetireResponse);
    rpc GetRetireStatus(GetRetireStatusRequest) returns (GetRetireStatusResponse);
    rpc ReassignTableForRetire(ReassignTableForRetireRequest) returns (ReassignTableForRetireResponse);
    rpc RemoveStandbyFromTables(RemoveStandbyFromTablesRequest) returns (RemoveStandbyFromTablesResponse);
    rpc RecommendScaleIn(RecommendScaleInRequest) returns (RecommendScaleInResponse);
}

// ============================================================================
// Node Management
// ============================================================================

enum NodeRole {
    NODE_ROLE_UNKNOWN = 0;
    NODE_ROLE_META = 1;
    NODE_ROLE_ROUTER = 2;
    NODE_ROLE_DATA = 3;
    NODE_ROLE_COMPACTOR = 4;
}

enum NodeState {
    NODE_STATE_UNKNOWN = 0;
    NODE_STATE_STARTING = 1;
    NODE_STATE_ACTIVE = 2;
    NODE_STATE_DRAINING = 3;      // Legacy: graceful shutdown for maintenance
    NODE_STATE_INACTIVE = 4;
    NODE_STATE_RETIRING = 5;      // Scale-in: no new writes, flushing memtable
    NODE_STATE_DRAINED = 6;       // Scale-in complete: safe to stop
}

// Data node operational mode (Cold Standby Architecture)
//
// Primary nodes actively serve writes and queries.
// Standby nodes only receive replication and are promoted on Primary failure.
// This prevents avalanche failures by having dedicated takeover nodes.
enum DataNodeMode {
    DATA_NODE_MODE_UNSPECIFIED = 0;  // Not a Data node or mode not set
    DATA_NODE_MODE_PRIMARY = 1;       // Active: serves writes and queries
    DATA_NODE_MODE_STANDBY = 2;       // Cold backup: only receives replication
}

message NodeInfo {
    string node_id = 1;
    NodeRole role = 2;
    NodeState state = 3;
    string advertise_addr = 4;      // gRPC address for internal communication
    string http_addr = 5;           // HTTP address (for routers)
    string flight_addr = 6;         // Arrow Flight address (for routers)
    int64 registered_at = 7;
    int64 last_heartbeat = 8;
    map<string, string> labels = 9; // Custom metadata
    // Data node mode (only relevant for Data nodes)
    // Auto-assigned by Meta based on primary_standby_ratio config
    DataNodeMode mode = 10;
}

message RegisterNodeRequest {
    NodeInfo info = 1;
    uint64 lease_ttl_ms = 2;        // Lease duration for auto-deregistration
}

message RegisterNodeResponse {
    bool success = 1;
    string error = 2;
    uint64 lease_id = 3;            // Lease ID for heartbeat renewal
    // Node-level standby assignment (for Data nodes)
    int32 assigned_mode = 4;        // DataNodeMode: 0=Primary, 1=Standby
    string backing_standby_id = 5;  // For Primary: the Standby backing this node
    string backing_standby_addr = 6; // Flight address of backing Standby
}

message HeartbeatRequest {
    string node_id = 1;
    uint64 lease_id = 2;
    int64 timestamp = 3;
    // Optional load metrics for routing decisions
    float cpu_usage = 4;
    float memory_usage = 5;
    uint64 active_connections = 6;
}

message HeartbeatResponse {
    bool success = 1;
    string error = 2;
    int64 next_heartbeat_ms = 3;    // Suggested next heartbeat interval
}

message DeregisterNodeRequest {
    string node_id = 1;
    uint64 lease_id = 2;
}

message DeregisterNodeResponse {
    bool success = 1;
    string error = 2;
}

message ListNodesRequest {
    NodeRole role_filter = 1;       // 0 = all roles
    NodeState state_filter = 2;     // 0 = all states
}

message ListNodesResponse {
    repeated NodeInfo nodes = 1;
}

// ============================================================================
// Table-Level Routing (Recommended)
// ============================================================================

// Table metadata for routing and statistics
message TableMeta {
    string catalog = 1;
    string schema = 2;
    string table = 3;
    repeated string owner_node_ids = 4; // Data nodes that own partitions (first is primary)
    uint32 partition_count = 5;         // Number of date partitions
    uint64 total_bytes = 6;             // Total storage size
    uint64 total_rows = 7;              // Total row count
    string oldest_partition = 8;        // e.g., "date=2024-01-01"
    string newest_partition = 9;        // e.g., "date=2024-01-31"
    int64 min_time = 10;                // Minimum timestamp
    int64 max_time = 11;                // Maximum timestamp
    int64 created_at = 12;
    int64 last_modified = 13;
    uint64 version = 14;                // For optimistic concurrency
    repeated string legacy_prefixes = 15; // Storage prefixes from retired nodes (scale-in)
}

// Statistics delta for updating table stats
message TableStatsDelta {
    int64 partition_count_delta = 1;    // +1 for new partition, 0 for existing
    int64 bytes_delta = 2;              // Bytes added/removed
    int64 rows_delta = 3;               // Rows added/removed
    int64 files_delta = 4;              // Files added/removed
    string newest_partition = 5;        // Update newest if newer
    int64 min_time = 6;
    int64 max_time = 7;
}

message RegisterTableRequest {
    string catalog = 1;
    string schema = 2;
    string table = 3;
    string owner_node_id = 4;
}

message RegisterTableResponse {
    bool success = 1;
    string error = 2;
    bool already_exists = 3;            // True if table already registered
    string current_owner = 4;           // Primary owner if already exists
    repeated string all_owners = 5;     // All owners (for multi-node tables)
    uint64 version = 6;
}

// Add an additional owner to a table (for rerouted writes)
message AddTableOwnerRequest {
    string catalog = 1;
    string schema = 2;
    string table = 3;
    string owner_node_id = 4;           // New owner to add
}

message AddTableOwnerResponse {
    bool success = 1;
    string error = 2;
    bool already_owner = 3;             // True if already an owner
    repeated string all_owners = 4;     // All owners after operation
    uint64 version = 5;
}

// Remove an owner from a table
message RemoveTableOwnerRequest {
    string catalog = 1;
    string schema = 2;
    string table = 3;
    string owner_node_id = 4;           // Owner to remove
}

message RemoveTableOwnerResponse {
    bool success = 1;
    string error = 2;
    repeated string all_owners = 3;     // Remaining owners after removal
    uint64 version = 4;
}

message UpdateTableStatsRequest {
    string catalog = 1;
    string schema = 2;
    string table = 3;
    TableStatsDelta delta = 4;
}

message UpdateTableStatsResponse {
    bool success = 1;
    string error = 2;
    uint64 version = 3;                 // New version after update
}

message ReassignTableRequest {
    string catalog = 1;
    string schema = 2;
    string table = 3;
    string new_owner_node_id = 4;
}

message ReassignTableResponse {
    bool success = 1;
    string error = 2;
    string old_primary = 3;             // Previous primary owner
    string new_primary = 4;             // New primary owner
    repeated string all_owners = 5;     // All owners after reassignment
    uint64 version = 6;
}

message RemoveTableRequest {
    string catalog = 1;
    string schema = 2;
    string table = 3;
}

message RemoveTableResponse {
    bool success = 1;
    string error = 2;
}

message GetTableOwnerRequest {
    string catalog = 1;
    string schema = 2;
    string table = 3;
}

message GetTableOwnerResponse {
    bool found = 1;
    string primary_owner_id = 2;        // Primary owner for new writes
    repeated string all_owner_ids = 3;  // All owners for scatter-gather queries
    TableMeta table_meta = 4;           // Full metadata if found
}

message ListTablesForNodeRequest {
    string node_id = 1;
}

message ListTablesForNodeResponse {
    repeated TableMeta tables = 1;
}

message ListTablesRequest {
    string catalog = 1;                 // Optional: filter by catalog
    string schema = 2;                  // Optional: filter by schema
}

message ListTablesResponse {
    repeated TableMeta tables = 1;
}

// ============================================================================
// Write Distribution Configuration
// ============================================================================

enum DistributionScope {
    DISTRIBUTION_SCOPE_UNKNOWN = 0;
    DISTRIBUTION_SCOPE_CATALOG = 1;
    DISTRIBUTION_SCOPE_SCHEMA = 2;
    DISTRIBUTION_SCOPE_TABLE = 3;
}

message DistributionConfig {
    string catalog = 1;             // Catalog name (required)
    string schema = 2;              // Schema name (optional - empty means catalog-level)
    string table = 3;               // Table name (optional - empty means schema/catalog-level)
    DistributionScope scope = 4;    // Scope level
    uint32 percent = 5;             // Distribution percentage [0-100]
    int64 created_at = 6;
    int64 last_modified = 7;
    uint64 version = 8;
}

message SetDistributionConfigRequest {
    string catalog = 1;
    string schema = 2;              // Optional
    string table = 3;               // Optional
    uint32 percent = 4;             // 0-100
}

message SetDistributionConfigResponse {
    bool success = 1;
    string error = 2;
    uint64 version = 3;
}

message DeleteDistributionConfigRequest {
    string catalog = 1;
    string schema = 2;              // Optional
    string table = 3;               // Optional
}

message DeleteDistributionConfigResponse {
    bool success = 1;
    string error = 2;
}

message GetDistributionConfigRequest {
    string catalog = 1;
    string schema = 2;              // Optional
    string table = 3;               // Optional
}

message GetDistributionConfigResponse {
    bool found = 1;
    DistributionConfig config = 2;
}

message GetEffectiveDistributionConfigRequest {
    string catalog = 1;
    string schema = 2;
    string table = 3;
}

message GetEffectiveDistributionConfigResponse {
    bool found = 1;
    DistributionConfig config = 2;  // Most specific matching config
}

message ListDistributionConfigsRequest {
    string catalog = 1;             // Optional: filter by catalog
}

message ListDistributionConfigsResponse {
    repeated DistributionConfig configs = 1;
}

// ============================================================================
// Distributed Locks
// ============================================================================

message TryLockRequest {
    string key = 1;                 // Lock key (e.g., "/locks/partitions/mydb/default/cpu/date=2024-01-15")
    string holder = 2;              // Node ID holding the lock
    uint64 ttl_ms = 3;              // Lock TTL (auto-release if holder dies)
}

message TryLockResponse {
    bool acquired = 1;
    uint64 fencing_token = 2;       // Monotonically increasing token for preventing zombie locks
    string current_holder = 3;      // If not acquired, who holds it
    int64 expires_at = 4;           // When the lock expires
    string error = 5;
}

message UnlockRequest {
    string key = 1;
    string holder = 2;
    uint64 fencing_token = 3;       // Must match to release
}

message UnlockResponse {
    bool success = 1;
    string error = 2;
}

message RenewLockRequest {
    string key = 1;
    string holder = 2;
    uint64 fencing_token = 3;
    uint64 ttl_ms = 4;
}

message RenewLockResponse {
    bool success = 1;
    int64 expires_at = 2;
    string error = 3;
}

message GetLockRequest {
    string key = 1;
}

message GetLockResponse {
    bool held = 1;
    string holder = 2;
    uint64 fencing_token = 3;
    int64 expires_at = 4;
}

// ============================================================================
// Leader Election
// ============================================================================

message CampaignRequest {
    string election = 1;            // Election name (e.g., "compaction-leader")
    string node_id = 2;
    uint64 lease_ttl_ms = 3;
}

message CampaignResponse {
    bool elected = 1;
    string current_leader = 2;
    uint64 term = 3;                // Election term for fencing
    string error = 4;
}

message ResignRequest {
    string election = 1;
    string node_id = 2;
    uint64 term = 3;
}

message ResignResponse {
    bool success = 1;
    string error = 2;
}

message GetLeaderRequest {
    string election = 1;
}

message GetLeaderResponse {
    bool has_leader = 1;
    string leader = 2;
    uint64 term = 3;
}

// ============================================================================
// Event System
// ============================================================================

enum EventType {
    EVENT_TYPE_UNKNOWN = 0;
    EVENT_TYPE_NODE_JOINED = 1;
    EVENT_TYPE_NODE_LEFT = 2;
    EVENT_TYPE_NODE_STATE_CHANGED = 3;
    EVENT_TYPE_FILES_REGISTERED = 4;
    EVENT_TYPE_FILES_REMOVED = 5;
    EVENT_TYPE_LEADER_CHANGED = 6;
    EVENT_TYPE_CACHE_INVALIDATE = 7;
    EVENT_TYPE_SCHEMA_CHANGED = 8;
    // 9-11 reserved (formerly replica events, removed)
    // Cold Standby Architecture: Data node mode changed
    EVENT_TYPE_DATA_NODE_MODE_CHANGED = 12;
    // Table ownership changed (scale-in, failover)
    EVENT_TYPE_TABLE_OWNERSHIP_CHANGED = 13;
}

message Event {
    uint64 sequence = 1;            // Monotonically increasing
    EventType event_type = 2;
    string topic = 3;               // Topic for filtering (e.g., "files", "nodes", "cache")
    bytes payload = 4;              // Event-specific data (JSON or protobuf)
    int64 timestamp = 5;
    string source_node = 6;         // Node that triggered the event
}

message SubscribeRequest {
    repeated string topics = 1;     // Topics to subscribe to (empty = all)
    uint64 start_sequence = 2;      // Start from this sequence (0 = latest)
}

message PublishRequest {
    string topic = 1;
    EventType event_type = 2;
    bytes payload = 3;
}

message PublishResponse {
    bool success = 1;
    uint64 sequence = 2;
    string error = 3;
}

// ============================================================================
// Cluster Status
// ============================================================================

message GetClusterStatusRequest {}

message GetClusterStatusResponse {
    string meta_leader = 1;
    uint32 meta_nodes = 2;
    uint32 router_nodes = 3;
    uint32 data_nodes = 4;
    uint32 compactor_nodes = 5;
    bool healthy = 6;
    repeated NodeInfo nodes = 7;
}

message GetRaftStatusRequest {}

message GetRaftStatusResponse {
    uint64 node_id = 1;
    string role = 2;                // "leader", "follower", "candidate"
    uint64 term = 3;
    uint64 last_log_index = 4;
    uint64 commit_index = 5;
    uint64 last_applied = 6;
    string leader_id = 7;
    repeated RaftPeerStatus peers = 8;
}

message RaftPeerStatus {
    uint64 node_id = 1;
    string address = 2;
    bool reachable = 3;
    uint64 match_index = 4;
    uint64 next_index = 5;
}

// ============================================================================
// Raft Internal Service (peer-to-peer communication)
// ============================================================================

service RaftInternal {
    rpc AppendEntries(RaftMessage) returns (RaftMessage);
    rpc InstallSnapshot(RaftMessage) returns (RaftMessage);
    rpc Vote(RaftMessage) returns (RaftMessage);
    // Forward a command to leader (for server-side proxy)
    rpc ForwardCommand(ForwardCommandRequest) returns (ForwardCommandResponse);
}

// Generic Raft message (serialized openraft types)
message RaftMessage {
    bytes data = 1;
}

// Forward command request (for server-side proxy forwarding)
message ForwardCommandRequest {
    bytes command_data = 1;     // bincode-serialized MetaCommand
}

message ForwardCommandResponse {
    bool success = 1;
    string error = 2;
    uint64 result = 3;          // Result value (lease_id, sequence, fencing_token, etc.)
    bytes response_data = 4;    // bincode-serialized MetaResponse for complex responses
}

// ============================================================================
// Data Node Mode Management (Cold Standby Architecture)
// ============================================================================

// Note: PromoteDataNode removed - using No-Promotion architecture
// Standby nodes never promote to Primary; K8s handles node replacement
// When Primary fails, Standby flushes cache to S3 and K8s replaces the Primary pod

// Get the current mode of a data node
message GetDataNodeModeRequest {
    string node_id = 1;
}

message GetDataNodeModeResponse {
    bool found = 1;
    string node_id = 2;
    DataNodeMode mode = 3;
    string error = 4;
}

// ============================================================================
// Scale-In (Retirement) Operations
// ============================================================================

// Start retiring a node (scale-in)
// Marks the node as Retiring: no new writes, begins table reassignment
message StartRetireRequest {
    string node_id = 1;
}

message StartRetireResponse {
    bool success = 1;
    string error = 2;
    uint32 tables_to_reassign = 3;  // Number of tables to transfer
}

// Mark a node as fully drained (scale-in complete)
message CompleteRetireRequest {
    string node_id = 1;
}

message CompleteRetireResponse {
    bool success = 1;
    string error = 2;
}

// Cancel a node retirement (restore to Active)
message CancelRetireRequest {
    string node_id = 1;
}

message CancelRetireResponse {
    bool success = 1;
    string error = 2;
}

// Get retirement status/progress for a node
message GetRetireStatusRequest {
    string node_id = 1;
}

message GetRetireStatusResponse {
    bool found = 1;
    string node_id = 2;
    NodeState state = 3;
    int64 started_at = 4;
    uint32 tables_total = 5;
    uint32 tables_reassigned = 6;
    uint64 memtable_rows_remaining = 7;
    uint32 progress_percent = 8;
    string error = 9;
}

// Reassign a table from a retiring node to another Primary
message ReassignTableForRetireRequest {
    string table_key = 1;           // "catalog/schema/table" format
    string from_node_id = 2;
    string to_node_id = 3;
}

message ReassignTableForRetireResponse {
    bool success = 1;
    string error = 2;
}

// Remove a standby from node-level pairing (for Standby scale-in)
message RemoveStandbyFromTablesRequest {
    string standby_node_id = 1;
}

message RemoveStandbyFromTablesResponse {
    bool success = 1;
    string error = 2;
    uint32 tables_affected = 3;
}

// Get recommendations for which nodes to scale in
message RecommendScaleInRequest {
    uint32 reduce_primaries = 1;  // How many Primaries to reduce
    uint32 reduce_standbys = 2;   // How many Standbys to reduce
}

message RecommendScaleInResponse {
    bool success = 1;
    string error = 2;
    repeated string recommended_primaries = 3;
    repeated string recommended_standbys = 4;
    map<string, string> reasons = 5;  // node_id -> reason
    repeated string warnings = 6;
}
