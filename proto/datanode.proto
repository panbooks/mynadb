syntax = "proto3";

package datanode;

// ============================================================================
// Data Node Internal Service - Router to Data Node communication
// ============================================================================

service DataNodeService {
    // Write operations
    rpc Write(WriteRequest) returns (WriteResponse);
    rpc BatchWrite(stream WriteRequest) returns (WriteResponse);

    // Query operations
    rpc Query(QueryRequest) returns (stream QueryResponse);
    rpc QueryArrow(QueryArrowRequest) returns (stream QueryArrowResponse);

    // Direct operations (for debugging/admin)
    rpc Flush(FlushRequest) returns (FlushResponse);
    rpc GetStats(GetStatsRequest) returns (GetStatsResponse);

    // Health
    rpc Health(HealthRequest) returns (HealthResponse);
}

// ============================================================================
// Write Operations
// ============================================================================

message WriteRequest {
    string catalog = 1;
    string schema = 2;
    string table = 3;
    string partition = 4;           // Date partition (YYYY-MM-DD)
    bytes line_protocol = 5;        // Raw InfluxDB line protocol data
    uint64 fencing_token = 6;       // From lock acquisition (for validation)
}

message WriteResponse {
    bool success = 1;
    string error = 2;
    uint64 points_written = 3;
    uint64 bytes_written = 4;
}

// ============================================================================
// Query Operations
// ============================================================================

message QueryRequest {
    string catalog = 1;
    string sql = 2;
    int64 min_time = 3;             // Time range filter (nanoseconds)
    int64 max_time = 4;
    repeated string partitions = 5; // Specific partitions to scan (if known)
    uint32 max_rows = 6;            // Optional limit
}

message QueryResponse {
    oneof result {
        RecordBatchData batch = 1;
        QueryError error = 2;
        QueryComplete complete = 3;
    }
}

message RecordBatchData {
    bytes schema_ipc = 1;           // Arrow IPC schema (only in first batch)
    bytes data_ipc = 2;             // Arrow IPC record batch
    uint64 row_count = 3;
}

message QueryError {
    string message = 1;
    string code = 2;
}

message QueryComplete {
    uint64 total_rows = 1;
    uint64 execution_time_ms = 2;
    uint64 bytes_scanned = 3;
}

// Arrow Flight-style query (returns raw Arrow IPC)
message QueryArrowRequest {
    string catalog = 1;
    string sql = 2;
    int64 min_time = 3;
    int64 max_time = 4;
    repeated string partitions = 5;
}

message QueryArrowResponse {
    bytes ipc_message = 1;          // Arrow IPC message (schema or record batch)
}

// ============================================================================
// Admin Operations
// ============================================================================

message FlushRequest {
    string catalog = 1;             // Optional: specific catalog
    string schema = 2;              // Optional: specific schema
    string table = 3;               // Optional: specific table
    bool force = 4;                 // Flush even if below threshold
}

message FlushResponse {
    bool success = 1;
    string error = 2;
    uint64 files_flushed = 3;
    uint64 bytes_flushed = 4;
}

message GetStatsRequest {}

message GetStatsResponse {
    // Cache stats
    uint64 cache_size_bytes = 1;
    uint64 cache_entries = 2;
    float cache_hit_rate = 3;

    // WAL stats
    uint64 wal_size_bytes = 4;
    uint64 wal_entries = 5;

    // Query stats
    uint64 queries_total = 6;
    uint64 queries_in_flight = 7;
    double avg_query_time_ms = 8;

    // Write stats
    uint64 writes_total = 9;
    uint64 points_total = 10;
    double avg_write_time_ms = 11;
}

// ============================================================================
// Health Check
// ============================================================================

message HealthRequest {}

message HealthResponse {
    bool healthy = 1;
    string status = 2;              // "ready", "starting", "draining", "unhealthy"
    int64 uptime_secs = 3;
    map<string, string> details = 4;
}
