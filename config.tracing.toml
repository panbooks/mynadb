# MynaDB Configuration with Tracing Enabled

[server]
http_host = "0.0.0.0"
http_port = 7000
flight_host = "0.0.0.0"
flight_port = 7001
mysql_enabled = true
mysql_port = 7002

[storage]
data_dir = "./data"

[cache]
flush_interval_secs = 60
max_size_mb = 4096

[wal]
enabled = true
sync_on_write = false

[tracing]
# Enable query tracing and profiling
enabled = false
# OTLP endpoint for OpenTelemetry (optional)
# otlp_endpoint = "http://localhost:4317"
service_name = "mynadb"
# Slow query threshold in milliseconds
slow_query_threshold_ms = 100
# Enable slow query logging
slow_query_logging = true
# Enable query timeline tracking
timeline_enabled = true
# Maximum number of timelines to keep in memory
max_timelines = 1000
# Sample rate for tracing (0.0 to 1.0)
sample_rate = 1.0

[compaction]
min_files = 5
max_level = 5
interval_secs = 60

[logging]
level = "info"
log_dir = "./logs"
