<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(40, 40)">
    <!-- Background circle -->
    <circle cx="0" cy="0" r="32" fill="url(#iconBg)"/>

    <!-- Myna bird -->
    <g transform="translate(2, 4)">
      <!-- Body -->
      <path d="
        M -10 4
        C -15 -3, -13 -14, -5 -17
        C 4 -20, 15 -15, 18 -6
        C 20 1, 16 10, 10 14
        C 2 18, -6 15, -10 10
        Z
      " fill="#1e293b"/>

      <!-- Eye patch -->
      <ellipse cx="-6" cy="-10" rx="5" ry="4" fill="#f59e0b"/>

      <!-- Eye -->
      <circle cx="-6" cy="-10" r="2.5" fill="#0f172a"/>
      <circle cx="-5" cy="-11" r="1" fill="#fff"/>

      <!-- Beak -->
      <path d="M -13 -8 L -20 -6 L -13 -5 Z" fill="#fb923c"/>

      <!-- Sound wave -->
      <path d="M -21 -6 Q -24 -6 -25 -3" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/>

      <!-- Tail -->
      <path d="M 14 8 L 22 13 L 16 9 Z" fill="#1e293b"/>

      <!-- Data dot -->
      <circle cx="20" cy="-8" r="2.5" fill="#fff" opacity="0.8"/>
    </g>
  </g>

  <!-- Text: MynaDB -->
  <text x="88" y="50" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="700" fill="url(#textGrad)">
    <tspan>Myna</tspan><tspan fill="#0284c7">DB</tspan>
  </text>

  <!-- Tagline -->
  <text x="88" y="66" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#64748b" letter-spacing="0.5">
    The Voice of Your Machines
  </text>
</svg>
