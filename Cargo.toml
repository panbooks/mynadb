[workspace]
members = ["."]

[package]
name = "mynadb"
version = "0.1.0"
edition = "2021"
description = "mynadb, the voice of your machines"
default-run = "mynadb"

[lib]
name = "mynadb"
path = "src/lib.rs"

[[bin]]
name = "mynadb"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros", "ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arrow = "53"
parquet = { version = "53", features = ["arrow", "async", "object_store"] }
chrono = "0.4"
datafusion = "43"
arrow-flight = "53"
tonic = { version = "0.12", features = ["tls"] }
futures = "0.3"
tokio-stream = "0.1"
config = "0.14"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-opentelemetry = "0.26"
opentelemetry = { version = "0.25", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.25", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.25", features = ["tonic", "trace"] }
clap = { version = "4.5", features = ["derive"] }
msql-srv = "0.10"
crc32fast = "1.4"
bincode = "1.3"
bloomfilter = "1.0"
wildmatch = "2.1"
base64 = "0.22"
urlencoding = "2.1"
pprof = { version = "0.14", features = ["flamegraph", "prost-codec"] }
prost = "0.13"
object_store = { version = "0.11", features = ["aws"] }
url = "2.5"
bytes = "1.5"
async-trait = "0.1"
parking_lot = "0.12"
num_cpus = "1.16"
rayon = "1.10"
regex = "1.10"
libc = "0.2"
rand = "0.8"

# Cluster support - Meta Service (Raft-based)
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
sled = "0.34"
dashmap = "6.0"
lru = "0.12"
prometheus = "0.13"
uuid = { version = "1.7", features = ["v4"] }
hostname = "0.4"

# Authentication (RBAC)
argon2 = "0.5"

# TLS/SSL support
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls-pemfile = "2.0"
rustls = "0.20"

# Geospatial UDFs
geo = "0.28"
geohash = "0.13"

# Time-series forecasting
arima = "0.2"

# Prometheus Remote Storage
snap = "1.1"  # Snappy compression for Prometheus remote write

# Admin Console
futures-util = "0.3"
axum-extra = { version = "0.9", features = ["typed-header"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }

[dev-dependencies]
tempfile = "3"
ureq = "2"
serde_json = "1"
chrono = "0.4"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
walkdir = "2"

[[bench]]
name = "line_protocol_bench"
harness = false

[[bench]]
name = "query_bench"
harness = false

[[bench]]
name = "time_functions_bench"
harness = false

[[bench]]
name = "sled_bench"
harness = false

[build-dependencies]
chrono = "0.4"
tonic-build = "0.12"
# Optimize dev builds for faster iteration
[profile.dev]
split-debuginfo = "unpacked"  # Faster incremental builds
debug = 1                      # Less debug info = faster link

[profile.dev.package."*"]
opt-level = 2                  # Optimize dependencies

[profile.test]
inherits = "dev"
