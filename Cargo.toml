[package]
name = "mynadb"
version = "0.2.8"
edition = "2021"
description = "mynadb, the voice of your machines"

[[bin]]
name = "mynadb"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arrow = "53"
parquet = { version = "53", features = ["arrow", "async", "object_store"] }
chrono = "0.4"
datafusion = "43"
arrow-flight = "53"
tonic = "0.12"
futures = "0.3"
tokio-stream = "0.1"
config = "0.14"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
clap = { version = "4.5", features = ["derive"] }
msql-srv = "0.10"
crc32fast = "1.4"
bincode = "1.3"
bloomfilter = "1.0"
wildmatch = "2.1"
base64 = "0.22"
urlencoding = "2.1"
pprof = { version = "0.14", features = ["flamegraph", "prost-codec"] }
prost = "0.13"
object_store = { version = "0.11", features = ["aws"] }
url = "2.5"
bytes = "1.5"
async-trait = "0.1"
parking_lot = "0.12"
num_cpus = "1.16"
rayon = "1.10"
regex = "1.10"

[dev-dependencies]
tempfile = "3"
ureq = "2"
serde_json = "1"
chrono = "0.4"
proptest = "1"

[build-dependencies]
chrono = "0.4"