name: Feature request
description: Describe a concrete use case or improvement
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: What are you trying to do, and what prevents it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How would you verify this works?
      description: Include examples, expected output, and compatibility requirements where relevant.
