[server]
# HTTP REST API configuration
http_host = "0.0.0.0"
http_port = 7000

# Arrow Flight gRPC configuration
flight_host = "0.0.0.0"
flight_port = 7001

[storage]
# Data directory path (use absolute path in production)
data_dir = "/data0/stats/data"

# System directory name (for metadata like series stats, retention exclusions)
system_dir = "_system"

# Object store configuration
[storage.object_store]
# Storage backend: "local" (default), "s3", "minio", "oss"
backend = "local"

# Data directory for local storage
data_dir = "/data0/stats/data"

# S3/MinIO/OSS configuration (only used when backend != "local")
# bucket = "my-bucket"
# region = "us-east-1"
# access_key = "your-access-key"
# secret_key = "your-secret-key"

# Custom endpoint for MinIO or Aliyun OSS
# endpoint = "http://localhost:9000"  # MinIO example
# endpoint = "https://oss-cn-hangzhou.aliyuncs.com"  # Aliyun OSS example

# Allow HTTP connections (for local MinIO without TLS)
# allow_http = true

# Optional prefix for all paths in the bucket
# prefix = "stats-data"

[schema]
# Schema/Table naming strategy
# - "service_as_schema": service tag → schema, measurement → table (default)
#     Example: cpu,service=1 → mydb.service_1.cpu
# - "service_as_table": "default" → schema, service tag → table
#     Example: cpu,service=1 → mydb.default.service_1 (measurement stored as tag)
strategy = "service_as_schema"

# Tag keys to extract service from (used for schema or table depending on strategy)
# The first matching tag key will be used
# Example: ["MONITOR.service", "hierarchy_2", "service"]
tag_keys = ["MONITOR.service", "hierarchy_2", "service"]

# Default schema name when tag is not present
# - In "service_as_schema" mode: fallback schema name
# - In "service_as_table" mode: the schema name AND fallback table name
default_name = "default"

# Whether to prefix purely numeric values (e.g., "123" -> "service_123")
# This avoids SQL parser issues with numeric identifiers
prefix_numeric = true

[cache]
# Background flush interval in seconds
flush_interval_secs = 30

# Maximum cache size in MB before forcing flush
max_size_mb = 4096

[compaction]
# Minimum number of files to trigger compaction
min_files = 5

# Target file size in MB after compaction
target_file_size_mb = 200

# Maximum compaction level
max_level = 5

# Interval seconds
interval_secs = 70

# Rate limiting settings (prevents I/O saturation during compaction)

# Maximum concurrent compaction operations (0 = unlimited, default: 8)
# Limits number of partitions that can be compacted in parallel (LSM compaction)
# Lower values reduce resource usage but slow down compaction
max_concurrent_compactions = 8

# Maximum concurrent full compaction operations (0 = unlimited, default: 2)
# Limits number of partitions for full compaction in parallel
# Set lower than max_concurrent_compactions to avoid OOM during full compaction
# Full compaction processes entire partitions and uses more memory
full_compaction_max_concurrent = 2

# Read rate limit in MB/sec (0 = unlimited, default: 0)
# Throttles parquet file reads to prevent I/O saturation
# Useful on shared storage or when queries compete with compaction
# Example: 100 MB/s = read_rate_limit_mb_per_sec = 100
read_rate_limit_mb_per_sec = 0

# Write rate limit in MB/sec (0 = unlimited, default: 0)
# Throttles parquet file writes to prevent I/O saturation
# Less critical than read limiting (writes are buffered)
# Example: 100 MB/s = write_rate_limit_mb_per_sec = 100
write_rate_limit_mb_per_sec = 0

[logging]
# Log level: trace, debug, info, warn, error
level = "info"

# Log directory path
log_dir = "/data0/stats/logs"

# Log file name prefix
file_prefix = "stats-service"

# Log file rotation: daily, hourly, never
rotation = "daily"

# Maximum number of log files to keep
max_files = 10

# Enable JSON formatted logs (default: false for human-readable format)
json_format = false

[retention]
# Enable automatic retention checks
enabled = true

# Default retention period in days (partitions older than this will be deleted)
default_days = 7

# Background retention check interval in seconds
interval_secs = 3600  # 1 hour

# Databases to exclude from automatic retention (optional)
# exclude_databases = ["_system"]

# Tables to exclude from automatic retention (optional, format: "catalog.schema.table")
# exclude_tables = ["mydb.default.important_metrics"]

[wal]
# Enable Write-Ahead Log for durability
enabled = true

# Sync to disk after each write (true=durable but slower, false=faster but may lose data on crash)
sync_on_write = true

# Rotate WAL file when it exceeds this size (MB)
rotate_size_mb = 128

# Background cleanup interval in seconds
cleanup_interval_secs = 3600  # 1 hour

# Retention period for WAL files in hours (files older than this can be deleted after successful flush)
retention_hours = 24

[auth]
# Enable HTTP Basic Authentication (default: false)
# When enabled, all write and query endpoints require authentication
enabled = false

# Username for basic authentication
username = "admin"

# Password for basic authentication (stored in plaintext in config file)
# IMPORTANT: Use strong passwords and protect this config file (chmod 600)
password = "admin2026"

# Endpoints that are always public (even if auth is enabled)
# Health and stats endpoints are public by default
public_endpoints = ["/health", "/stats", "/memory", "/debug/heap", "/debug/cpu", "/debug/profile/heap", "/debug/profile/cpu"]
