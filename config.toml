[server]
# HTTP REST API configuration
http_host = "0.0.0.0"
http_port = 7000

# Arrow Flight gRPC configuration
flight_host = "0.0.0.0"
flight_port = 7001

[storage]
# Data directory path (use absolute path in production)
data_dir = "/data0/stats/data"

# System directory name for metadata
system_dir = "_system"

[schema]
# Tag keys to extract schema from (default: ["service"])
# The first matching tag key will be used as the schema
# Example: ["service", "hierarchy_2", "app_name"]
tag_keys = ["MONITOR.service", "hierarchy_2", "service"]

# Default schema name when tag is not present
default_name = "default"

# Whether to prefix purely numeric schemas (e.g., "123" -> "service_123")
# This avoids SQL parser issues with numeric identifiers
prefix_numeric = true

[cache]
# Background flush interval in seconds
flush_interval_secs = 30

# Maximum cache size in MB before forcing flush
max_size_mb = 4096

[compaction]
# Minimum number of files to trigger compaction
min_files = 4

# Maximum file size in MB before compaction
max_file_size_mb = 100

# Target file size in MB after compaction
target_file_size_mb = 500

# Maximum compaction level
max_level = 5

# Interval seconds
interval_secs = 70

[series_tracker]
# Background flush interval in seconds
flush_interval_secs = 60

# Series stats directory name
stats_dir = "pmc"

# Number of days to keep in cache (and load on startup)
cache_retention_days = 2

# Default deduplication strategy: "hashset" or "bloom"
# - hashset: Exact deduplication, ~24 bytes per series (best for < 100M series)
# - bloom: Probabilistic deduplication, ~1.4 bytes per series (best for > 100M series)
default_strategy = "hashset"

# Databases that use bloom filter (supports wildcards)
# Example: ["production", "metrics_*", "monitoring"]
bloom_databases = ["arch_monitor_roc", "arch_monitor_rec"]

# Default bloom filter configuration (for all bloom databases)
[series_tracker.bloom]
expected_series_per_day = 1000000000  # 1 billion
false_positive_rate = 0.01            # 1% (lower = more accurate but more memory)

# Per-database bloom filter customization (optional)
# Allows fine-tuning for databases with different cardinality
[[series_tracker.bloom_custom]]
database = "arch_monitor_roc"
expected_series_per_day = 2000000000  # 5 billion series
false_positive_rate = 0.005           # 0.5% (more accurate)

 [[series_tracker.bloom_custom]]
 database = "arch_monitor_rec"
 expected_series_per_day = 10000000000 # 10 billion series
 false_positive_rate = 0.01

[logging]
# Log level: trace, debug, info, warn, error
level = "info"

# Log directory path
log_dir = "/data0/stats/logs"

# Log file name prefix
file_prefix = "stats-service"

# Log file rotation: daily, hourly, never
rotation = "daily"

# Maximum number of log files to keep
max_files = 30

# Enable JSON formatted logs (default: false for human-readable format)
json_format = false

[retention]
# Enable automatic retention checks
enabled = true

# Default retention period in days (partitions older than this will be deleted)
default_days = 7

# Background retention check interval in seconds
interval_secs = 3600  # 1 hour

# Databases to exclude from automatic retention (optional)
# exclude_databases = ["_system"]

# Tables to exclude from automatic retention (optional, format: "catalog.schema.table")
# exclude_tables = ["mydb.default.important_metrics"]

[wal]
# Enable Write-Ahead Log for durability
enabled = true

# Sync to disk after each write (true=durable but slower, false=faster but may lose data on crash)
sync_on_write = true

# Rotate WAL file when it exceeds this size (MB)
rotate_size_mb = 64

# Background cleanup interval in seconds
cleanup_interval_secs = 3600  # 1 hour

# Retention period for WAL files in hours (files older than this can be deleted after successful flush)
retention_hours = 24
