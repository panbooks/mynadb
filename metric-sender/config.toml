# Metric Sender Configuration

# Stats Service URL
url = "http://localhost:7000"

# Database to query (usually "_system" for series stats)
database = "_system"

# Scraping interval in minutes
interval_minutes = 5

# HTTP client timeouts
connect_timeout_secs = 10  # TCP connection timeout (default: 10s)
read_timeout_secs = 30     # HTTP read timeout (default: 30s)

# Retry configuration
max_retries = 3            # Maximum retry attempts on failure (default: 3)
retry_delay_secs = 2       # Base delay between retries in seconds (default: 2s)
                           # Uses exponential backoff: delay = retry_delay_secs * attempt_number
                           # Example: attempt 1 = 2s, attempt 2 = 4s, attempt 3 = 6s
