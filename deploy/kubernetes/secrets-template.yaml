# MynaDB Secrets Template
#
# Copy this file and fill in your actual values:
#   cp secrets-template.yaml secrets.yaml
#   # Edit secrets.yaml with your credentials
#   kubectl apply -f secrets.yaml
#
# IMPORTANT: Do NOT commit secrets.yaml to version control!

apiVersion: v1
kind: Secret
metadata:
  name: mynadb-s3-credentials
  labels:
    app.kubernetes.io/name: mynadb
    app.kubernetes.io/component: storage
type: Opaque
stringData:
  # S3 bucket name
  bucket: "your-mynadb-bucket"
  
  # AWS region (optional, defaults to us-east-1)
  region: "us-east-1"
  
  # Custom endpoint for MinIO or other S3-compatible storage (optional)
  # endpoint: "http://minio.minio-system:9000"
  
  # AWS credentials
  access_key_id: "YOUR_ACCESS_KEY_ID"
  secret_access_key: "YOUR_SECRET_ACCESS_KEY"
