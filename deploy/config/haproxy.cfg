global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    retries 3

# Stats page
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST

# HTTP API frontend
frontend http_front
    bind *:80
    default_backend mynadb_http

# HTTP API backend - round robin load balancing
backend mynadb_http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server mynadb-1 mynadb-1:7000 check inter 5s fall 3 rise 2
    server mynadb-2 mynadb-2:7000 check inter 5s fall 3 rise 2
    server mynadb-3 mynadb-3:7000 check inter 5s fall 3 rise 2

# Arrow Flight frontend (TCP mode)
frontend flight_front
    bind *:7001
    mode tcp
    default_backend mynadb_flight

backend mynadb_flight
    mode tcp
    balance roundrobin
    option tcp-check
    server mynadb-1 mynadb-1:7001 check inter 5s fall 3 rise 2
    server mynadb-2 mynadb-2:7001 check inter 5s fall 3 rise 2
    server mynadb-3 mynadb-3:7001 check inter 5s fall 3 rise 2

# MySQL protocol frontend (TCP mode)
frontend mysql_front
    bind *:7002
    mode tcp
    default_backend mynadb_mysql

backend mynadb_mysql
    mode tcp
    balance roundrobin
    option tcp-check
    server mynadb-1 mynadb-1:7002 check inter 5s fall 3 rise 2
    server mynadb-2 mynadb-2:7002 check inter 5s fall 3 rise 2
    server mynadb-3 mynadb-3:7002 check inter 5s fall 3 rise 2
