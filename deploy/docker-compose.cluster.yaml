version: '3.8'

services:
  # etcd cluster for coordination
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: etcd-1
    command:
      - etcd
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-1:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-token=mynadb-cluster
      - --initial-cluster-state=new
    volumes:
      - etcd1-data:/etcd-data
    networks:
      - mynadb-cluster

  etcd-2:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: etcd-2
    command:
      - etcd
      - --name=etcd-2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-2:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-token=mynadb-cluster
      - --initial-cluster-state=new
    volumes:
      - etcd2-data:/etcd-data
    networks:
      - mynadb-cluster

  etcd-3:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: etcd-3
    command:
      - etcd
      - --name=etcd-3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-3:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-token=mynadb-cluster
      - --initial-cluster-state=new
    volumes:
      - etcd3-data:/etcd-data
    networks:
      - mynadb-cluster

  # MinIO for object storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - mynadb-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Create bucket on startup
  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/mynadb;
      exit 0;
      "
    networks:
      - mynadb-cluster

  # MynaDB Node 1
  mynadb-1:
    image: mynadb:latest
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    container_name: mynadb-1
    environment:
      MYNADB_NODE_ID: mynadb-1
      MYNADB_ADVERTISE_ADDR: mynadb-1:7000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    volumes:
      - ./config/node1.toml:/etc/mynadb/config.toml:ro
      - mynadb1-data:/data/mynadb
    ports:
      - "7000:7000"
      - "7001:7001"
      - "7002:7002"
    networks:
      - mynadb-cluster
    depends_on:
      - etcd-1
      - etcd-2
      - etcd-3
      - minio-setup
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MynaDB Node 2
  mynadb-2:
    image: mynadb:latest
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    container_name: mynadb-2
    environment:
      MYNADB_NODE_ID: mynadb-2
      MYNADB_ADVERTISE_ADDR: mynadb-2:7000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    volumes:
      - ./config/node2.toml:/etc/mynadb/config.toml:ro
      - mynadb2-data:/data/mynadb
    ports:
      - "7010:7000"
      - "7011:7001"
      - "7012:7002"
    networks:
      - mynadb-cluster
    depends_on:
      - etcd-1
      - etcd-2
      - etcd-3
      - minio-setup
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MynaDB Node 3
  mynadb-3:
    image: mynadb:latest
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    container_name: mynadb-3
    environment:
      MYNADB_NODE_ID: mynadb-3
      MYNADB_ADVERTISE_ADDR: mynadb-3:7000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    volumes:
      - ./config/node3.toml:/etc/mynadb/config.toml:ro
      - mynadb3-data:/data/mynadb
    ports:
      - "7020:7000"
      - "7021:7001"
      - "7022:7002"
    networks:
      - mynadb-cluster
    depends_on:
      - etcd-1
      - etcd-2
      - etcd-3
      - minio-setup
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # HAProxy load balancer
  haproxy:
    image: haproxy:2.8
    container_name: haproxy
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "80:80"
      - "8404:8404"
    networks:
      - mynadb-cluster
    depends_on:
      - mynadb-1
      - mynadb-2
      - mynadb-3

networks:
  mynadb-cluster:
    driver: bridge

volumes:
  etcd1-data:
  etcd2-data:
  etcd3-data:
  minio-data:
  mynadb1-data:
  mynadb2-data:
  mynadb3-data:
