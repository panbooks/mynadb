# Router for Cold Standby testing
[server]
http_host = "0.0.0.0"
http_port = 7000
flight_host = "0.0.0.0"
flight_port = 7001
mysql_host = "0.0.0.0"
mysql_port = 7002
mysql_enabled = true

[router]
node_id = "router-1"

[router.meta]
endpoints = ["127.0.0.1:6000"]
connect_timeout_ms = 5000
request_timeout_ms = 30000

[router.routing]
cache_refresh_interval_ms = 1000
data_node_pool_size = 10
data_node_connect_timeout_ms = 5000
data_node_request_timeout_ms = 60000

[router.query]
cache_enabled = true
cache_max_size_mb = 256
cache_ttl_secs = 300

[router.auth]
enabled = false

[schema]
strategy = "service_as_schema"
tag_keys = ["service"]
default_name = "default"
prefix_numeric = true

[logging]
level = "info"
log_dir = "./dev/logs/coldstandby-simple/router1"
file_prefix = "router1"
rotation = "daily"
max_files = 7
