# MynaDB Data Node 1 Configuration (Local Storage)

[data]
node_id = "data-1"
http_port = 5000
advertise_addr = "127.0.0.1:5001"
http_addr = "http://127.0.0.1:5000"

meta_endpoints = ["127.0.0.1:6001", "127.0.0.1:6101", "127.0.0.1:6201"]
meta_connect_timeout_ms = 5000
meta_request_timeout_ms = 30000

[storage]
backend = "local"
data_dir = "./dev/data/cluster-local/data1"

[schema]
strategy = "service_as_schema"
tag_keys = ["service", "MONITOR.service", "hierarchy_2"]
default_name = "default"
prefix_numeric = true

[cache]
flush_interval_secs = 30
max_size_mb = 512

[wal]
enabled = true
sync_on_write = false
rotate_size_mb = 128

[query]
use_custom_table_provider = true

[query_cache]
enabled = true
max_size_mb = 128
ttl_secs = 300
min_query_time_ms = 10

[compaction]
min_files = 5
max_level = 5
interval_secs = 60
max_concurrent_compactions = 4
full_compaction_max_concurrent = 1

[retention]
enabled = false

[logging]
level = "info"
log_dir = "./dev/logs/cluster-local/data1"
file_prefix = "data1"
rotation = "daily"
max_files = 7
