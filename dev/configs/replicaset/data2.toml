# MynaDB Data Node 2 - Zone B
# Warm standby replication enabled

[data]
node_id = "data-2"
advertise_addr = "127.0.0.1:5103"
grpc_port = 5103
http_port = 5100
flight_port = 5101

# Meta service endpoints
meta_endpoints = ["127.0.0.1:6000", "127.0.0.1:6100", "127.0.0.1:6200"]
meta_connect_timeout_ms = 5000
meta_request_timeout_ms = 30000

# Zone label for zone-aware placement
# In K8s, this would come from MYNADB_ZONE env var
[data.labels]
"topology.kubernetes.io/zone" = "zone-b"
"topology.kubernetes.io/region" = "us-east-1"

# Warm standby replication
[data.replication]
enabled = true
mode = "async"
batch_interval_ms = 100
max_batch_size = 1000
ack_timeout_ms = 5000
max_lag_alert_ms = 10000

[storage]
backend = "minio"
data_dir = "./dev/data/replicaset/data2"
bucket = "mynadb"
region = "us-east-1"
access_key = "minioadmin"
secret_key = "minioadmin"
endpoint = "http://127.0.0.1:9000"
allow_http = true

[schema]
strategy = "service_as_schema"
tag_keys = ["service", "MONITOR.service", "hierarchy_2"]
default_name = "default"
prefix_numeric = true

[cache]
flush_interval_secs = 30
max_size_mb = 512

[wal]
enabled = true
sync_on_write = false
rotate_size_mb = 64

[query_cache]
enabled = true
max_size_mb = 64
ttl_secs = 300
min_query_time_ms = 10

[compaction]
min_files = 5
max_level = 5
interval_secs = 60
max_concurrent_compactions = 2
full_compaction_max_concurrent = 1

[retention]
enabled = false

[logging]
level = "info"
log_dir = "./dev/logs/replicaset/data2"
file_prefix = "data2"
rotation = "daily"
max_files = 7
