# MynaDB Standalone Configuration - Local Storage

[server]
http_host = "0.0.0.0"
http_port = 7000
flight_host = "0.0.0.0"
flight_port = 7001
mysql_host = "0.0.0.0"
mysql_port = 7002
mysql_enabled = true

[storage]
data_dir = "./dev/data/standalone"
backend = "local"

[schema]
strategy = "service_as_schema"
tag_keys = ["service", "MONITOR.service", "hierarchy_2"]
default_name = "default"
prefix_numeric = true

[cache]
flush_interval_secs = 60
max_size_mb = 2048

[wal]
enabled = false

[query_cache]
enabled = true
max_size_mb = 256
ttl_secs = 300
min_query_time_ms = 10

[compaction]
min_files = 5
max_level = 5
interval_secs = 60
max_concurrent_compactions = 4
full_compaction_max_concurrent = 1

[retention]
enabled = false

[auth]
enabled = false

[logging]
level = "info"
log_dir = "./dev/logs/standalone"
file_prefix = "standalone"
rotation = "daily"
max_files = 7
