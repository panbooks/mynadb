# MynaDB Meta Node 1 Configuration
# Cold Standby Architecture enabled

[meta]
# Unique node ID within the Raft cluster (1, 2, 3)
node_id = 1

# HTTP port for health checks and management API (base + 0)
http_port = 6000

# Address to bind the gRPC server (base + 1)
bind_addr = "0.0.0.0:6001"

# Address advertised to other nodes for Raft communication
advertise_addr = "127.0.0.1:6001"

# Directory for sled database and Raft logs
data_dir = "./dev/data/coldstandby/meta1"

# Initial cluster peers (other meta nodes - gRPC ports)
peers = ["127.0.0.1:6101", "127.0.0.1:6201"]

[meta.raft]
heartbeat_interval_ms = 150
election_timeout_min_ms = 300
election_timeout_max_ms = 500
snapshot_threshold = 10000
max_log_size_mb = 256

[meta.events]
max_events = 100000
retention_secs = 3600

# Warm standby replication assignment configuration
[meta.replication]
auto_assign_enabled = true
default_replication_factor = 2
zone_aware = true
min_nodes_for_replication = 2
lease_ttl_secs = 10
auto_promote = true
load_balance_strategy = "least_loaded"

# Cold Standby Architecture - 4 Primary : 2 Standby (2:1 ratio)
[meta.standby]
enabled = true
primary_standby_ratio = 2
auto_assign_mode = true
auto_promote = true
min_primary_nodes = 2

[logging]
level = "info"
log_dir = "./dev/logs/coldstandby/meta1"
file_prefix = "meta1"
rotation = "daily"
max_files = 7
