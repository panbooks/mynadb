# MynaDB Data Node 5 - Zone B (Standby - assigned by Meta)
# Cold Standby Architecture

[data]
node_id = "data-5"
# HTTP port for health checks and management API (base + 0)
http_port = 5400
# Advertised address for Flight server (base + 1)
advertise_addr = "127.0.0.1:5401"

# Meta service endpoints (gRPC ports)
meta_endpoints = ["127.0.0.1:6001", "127.0.0.1:6101", "127.0.0.1:6201"]
meta_connect_timeout_ms = 5000
meta_request_timeout_ms = 30000

[data.labels]
"topology.kubernetes.io/zone" = "zone-b"
"topology.kubernetes.io/region" = "us-east-1"

[data.replication]
enabled = true
mode = "async"
batch_interval_ms = 100
max_batch_size = 1000
ack_timeout_ms = 5000
max_lag_alert_ms = 10000

[storage]
backend = "minio"
data_dir = "./dev/data/coldstandby/data5"
bucket = "mynadb-coldstandby"
region = "us-east-1"
access_key = "minioadmin"
secret_key = "minioadmin"
endpoint = "http://127.0.0.1:9000"
allow_http = true

[schema]
strategy = "service_as_schema"
tag_keys = ["service", "MONITOR.service", "hierarchy_2"]
default_name = "default"
prefix_numeric = true

[cache]
flush_interval_secs = 30
max_size_mb = 256

[wal]
enabled = true
sync_on_write = false
rotate_size_mb = 64

[query_cache]
enabled = true
max_size_mb = 64
ttl_secs = 300
min_query_time_ms = 10

[compaction]
min_files = 5
max_level = 5
interval_secs = 60
max_concurrent_compactions = 2
full_compaction_max_concurrent = 1

[retention]
enabled = false

[logging]
level = "info"
log_dir = "./dev/logs/coldstandby/data5"
file_prefix = "data5"
rotation = "daily"
max_files = 7
