<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>

  <!-- Simplified Myna silhouette -->
  <g transform="translate(32, 35)">
    <!-- Body + head combined shape -->
    <path d="
      M -12 5
      C -18 -5, -16 -18, -6 -22
      C 4 -26, 18 -20, 22 -8
      C 25 2, 20 14, 12 18
      C 2 22, -8 18, -12 12
      Z
    " fill="#1e293b"/>

    <!-- Eye area (orange patch) -->
    <ellipse cx="-8" cy="-14" rx="6" ry="5" fill="#f59e0b"/>

    <!-- Eye -->
    <circle cx="-8" cy="-14" r="3" fill="#0f172a"/>
    <circle cx="-7" cy="-15" r="1.2" fill="#fff"/>

    <!-- Beak -->
    <path d="M -16 -12 L -24 -10 L -16 -8 Z" fill="#fb923c"/>

    <!-- Sound wave -->
    <path d="M -25 -10 Q -28 -10 -29 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Tail hint -->
    <path d="M 18 10 L 26 16 L 20 12 Z" fill="#1e293b"/>
  </g>
</svg>
