<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Main gradient for bird body -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="50%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>

    <!-- Accent gradient for highlights -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>

    <!-- Orange accent for beak and eye ring (myna characteristic) -->
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>

    <!-- Data stream gradient -->
    <linearGradient id="streamGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9" stop-opacity="0"/>
      <stop offset="50%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle (optional, can be removed for transparent) -->
  <circle cx="256" cy="256" r="240" fill="#0f172a"/>

  <!-- Outer ring - representing continuous data flow -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#accentGradient)" stroke-width="3" opacity="0.3"/>

  <!-- Stylized Myna Bird - facing right, listening pose -->
  <g transform="translate(256, 256)">

    <!-- Bird body - sleek, modern shape -->
    <path d="
      M -60 20
      C -80 -20, -70 -80, -30 -100
      C 10 -120, 60 -100, 90 -60
      C 110 -30, 100 20, 80 50
      C 60 80, 20 100, -20 90
      C -50 80, -70 50, -60 20
      Z
    " fill="url(#bodyGradient)"/>

    <!-- Wing detail - data visualization inspired -->
    <path d="
      M -40 -20
      C -30 -50, 10 -70, 50 -50
      C 70 -35, 75 -10, 60 10
      C 40 35, 0 40, -30 20
      C -45 5, -45 0, -40 -20
      Z
    " fill="#475569" opacity="0.8"/>

    <!-- Wing lines - like data streams -->
    <path d="M -20 -30 Q 20 -40 50 -25" stroke="url(#accentGradient)" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M -15 -15 Q 25 -20 55 -5" stroke="url(#accentGradient)" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -10 0 Q 30 0 55 15" stroke="url(#accentGradient)" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- Head -->
    <ellipse cx="-45" cy="-70" rx="45" ry="40" fill="url(#bodyGradient)"/>

    <!-- Myna's characteristic yellow/orange eye patch -->
    <path d="
      M -70 -85
      C -85 -75, -85 -55, -70 -50
      C -55 -45, -35 -50, -30 -65
      C -25 -80, -35 -90, -50 -90
      C -60 -90, -68 -88, -70 -85
      Z
    " fill="url(#orangeGradient)" opacity="0.9"/>

    <!-- Eye - alert, listening -->
    <circle cx="-50" cy="-70" r="12" fill="#0f172a"/>
    <circle cx="-50" cy="-70" r="8" fill="#1e293b"/>
    <circle cx="-47" cy="-73" r="4" fill="#ffffff"/>
    <circle cx="-53" cy="-68" r="2" fill="#ffffff" opacity="0.5"/>

    <!-- Beak - slightly open, ready to "speak" data -->
    <path d="
      M -85 -65
      L -110 -55
      L -85 -55
      Z
    " fill="url(#orangeGradient)"/>
    <path d="
      M -85 -55
      L -105 -48
      L -85 -50
      Z
    " fill="#ea580c"/>

    <!-- Sound waves emanating from beak - "The Voice" -->
    <g filter="url(#glow)">
      <path d="M -115 -55 Q -125 -55 -130 -45" stroke="url(#accentGradient)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
      <path d="M -120 -55 Q -135 -55 -145 -40" stroke="url(#accentGradient)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
      <path d="M -125 -55 Q -145 -55 -160 -35" stroke="url(#accentGradient)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- Tail feathers - sleek, pointing to data direction -->
    <path d="
      M 70 40
      L 130 80
      L 120 60
      L 140 70
      L 115 45
      L 130 50
      L 80 30
      Z
    " fill="url(#bodyGradient)"/>

    <!-- Data nodes floating around - representing stored metrics -->
    <g filter="url(#glow)">
      <circle cx="100" cy="-80" r="6" fill="url(#accentGradient)"/>
      <circle cx="130" cy="-50" r="4" fill="url(#accentGradient)" opacity="0.8"/>
      <circle cx="140" cy="-20" r="5" fill="url(#accentGradient)" opacity="0.7"/>
      <circle cx="135" cy="15" r="3" fill="url(#accentGradient)" opacity="0.6"/>
    </g>

    <!-- Connecting lines between data nodes -->
    <path d="M 100 -80 L 130 -50 L 140 -20 L 135 15" stroke="url(#accentGradient)" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="4,4"/>

  </g>

  <!-- Bottom arc - like a database foundation -->
  <path d="M 80 380 Q 256 420 432 380" stroke="url(#accentGradient)" stroke-width="4" fill="none" opacity="0.5"/>

</svg>
