# Stats Service - Schema Configuration Examples
# Copy the relevant [schema] section to your config.toml

# ============================================================
# EXAMPLE 1: Default Behavior (Same as Previous Version)
# ============================================================
# Use this if you want the same behavior as before
# - Uses "service" tag
# - Falls back to "default" schema
# - Prefixes numeric values: "123" -> "service_123"
# - Keeps full values: "MONITOR.web" -> "MONITOR.web"

[schema]
tag_key = "service"
default_name = "default"
prefix_numeric = true
extract_last_part = false
separator = "."

# Example metrics:
#   cpu,service=web,host=server1 value=0.5
#     → Schema: web
#   cpu,service=123,host=server1 value=0.5
#     → Schema: service_123
#   cpu,host=server1 value=0.5
#     → Schema: default (no service tag)


# ============================================================
# EXAMPLE 2: Hierarchical Extraction (Extract Last Part)
# ============================================================
# Use this if your service tags include environment or hierarchy
# Example: "MONITOR.web", "PROD.api", "DEV.payment"

[schema]
tag_key = "service"
default_name = "default"
prefix_numeric = true
extract_last_part = true  # ← Key difference
separator = "."

# Example metrics:
#   cpu,service=MONITOR.web,host=server1 value=0.5
#     → Schema: web (extracted from "MONITOR.web")
#   cpu,service=PROD.api,host=server1 value=0.5
#     → Schema: api (extracted from "PROD.api")
#   cpu,service=DEV.payment,host=server1 value=0.5
#     → Schema: payment (extracted from "DEV.payment")


# ============================================================
# EXAMPLE 3: Custom Tag Key (hierarchy_2)
# ============================================================
# Use this if your metrics use a different tag for service identification

[schema]
tag_key = "hierarchy_2"  # ← Key difference
default_name = "default"
prefix_numeric = true
extract_last_part = false
separator = "."

# Example metrics:
#   cpu,hierarchy_2=service_1,host=server1 value=0.5
#     → Schema: service_1
#   cpu,hierarchy_2=service_2,host=server1 value=0.5
#     → Schema: service_2
#   cpu,hierarchy_2=123,host=server1 value=0.5
#     → Schema: service_123


# ============================================================
# EXAMPLE 4: Slash Separator with Extraction
# ============================================================
# Use this if your tags use "/" as separator (e.g., "prod/web")

[schema]
tag_key = "service"
default_name = "default"
prefix_numeric = true
extract_last_part = true
separator = "/"  # ← Key difference

# Example metrics:
#   cpu,service=prod/web,host=server1 value=0.5
#     → Schema: web (extracted from "prod/web")
#   cpu,service=staging/api,host=server1 value=0.5
#     → Schema: api (extracted from "staging/api")


# ============================================================
# EXAMPLE 5: Keep Full Hierarchical Paths
# ============================================================
# Use this if you want to preserve full hierarchical paths as schema names
# Good for namespace isolation

[schema]
tag_key = "service"
default_name = "default"
prefix_numeric = true
extract_last_part = false  # ← Keep full path
separator = "."

# Example metrics:
#   cpu,service=monitoring.web,host=server1 value=0.5
#     → Schema: monitoring.web (full path preserved)
#   cpu,service=logging.api,host=server1 value=0.5
#     → Schema: logging.api (full path preserved)

# Note: You'll need to quote these schemas in SQL queries:
#   SELECT * FROM benchmark."monitoring.web".cpu


# ============================================================
# EXAMPLE 6: Custom Default Schema
# ============================================================
# Use this if you want a different fallback name

[schema]
tag_key = "service"
default_name = "uncategorized"  # ← Key difference
prefix_numeric = true
extract_last_part = false
separator = "."

# Example metrics:
#   cpu,host=server1 value=0.5 (no service tag)
#     → Schema: uncategorized (instead of "default")


# ============================================================
# EXAMPLE 7: Disable Numeric Prefixing
# ============================================================
# Use this if you want numeric schema names without prefix
# WARNING: May cause SQL parser issues with some query engines

[schema]
tag_key = "service"
default_name = "default"
prefix_numeric = false  # ← Key difference (not recommended)
extract_last_part = false
separator = "."

# Example metrics:
#   cpu,service=123,host=server1 value=0.5
#     → Schema: 123 (no prefix, may cause issues)
#   cpu,service=web,host=server1 value=0.5
#     → Schema: web


# ============================================================
# EXAMPLE 8: Multi-Level Hierarchies (Extract Deepest)
# ============================================================
# Use this for complex hierarchies like "ORG.TEAM.SERVICE"

[schema]
tag_key = "service"
default_name = "default"
prefix_numeric = true
extract_last_part = true  # Extracts last part only
separator = "."

# Example metrics:
#   cpu,service=acme.backend.payment,host=server1 value=0.5
#     → Schema: payment (extracted from "acme.backend.payment")
#   cpu,service=acme.frontend.web,host=server1 value=0.5
#     → Schema: web (extracted from "acme.frontend.web")


# ============================================================
# EXAMPLE 9: App Name Tag
# ============================================================
# Use this if you use "app_name" instead of "service"

[schema]
tag_key = "app_name"  # ← Key difference
default_name = "default"
prefix_numeric = true
extract_last_part = false
separator = "."

# Example metrics:
#   cpu,app_name=webserver,host=server1 value=0.5
#     → Schema: webserver
#   cpu,app_name=database,host=server1 value=0.5
#     → Schema: database


# ============================================================
# EXAMPLE 10: Hyphen Separator
# ============================================================
# Use this if your tags use "-" as separator

[schema]
tag_key = "service"
default_name = "default"
prefix_numeric = true
extract_last_part = true
separator = "-"  # ← Key difference

# Example metrics:
#   cpu,service=prod-web,host=server1 value=0.5
#     → Schema: web (extracted from "prod-web")
#   cpu,service=staging-api,host=server1 value=0.5
#     → Schema: api (extracted from "staging-api")


# ============================================================
# Testing Your Configuration
# ============================================================
# After copying a configuration to config.toml:
#
# 1. Restart the service
# 2. Write test data:
#    curl -X POST http://localhost:7000/write/test \
#      -d 'cpu,service=YOUR_VALUE,host=test value=0.5'
#
# 3. Check schemas:
#    curl http://localhost:7000/databases/test/schemas
#
# 4. Verify data directory:
#    ls -la ./data/test/
#
# 5. Query the data:
#    curl "http://localhost:7000/query/test?sql=SELECT+*+FROM+SCHEMA.cpu+LIMIT+10"


# ============================================================
# Production Recommendations
# ============================================================
# 
# ✅ DO:
# - Test configuration changes in dev/staging first
# - Use extract_last_part for simpler queries
# - Enable prefix_numeric to avoid SQL issues
# - Document your schema strategy
# - Monitor data directory structure
#
# ❌ DON'T:
# - Change configuration on production without testing
# - Use special characters in schema names
# - Disable prefix_numeric unless you understand the risks
# - Forget to restart after config changes
# - Mix hierarchical formats (be consistent)


# ============================================================
# Common Scenarios
# ============================================================
#
# Microservices: Use EXAMPLE 1 (simple service names)
# Multi-tenant: Use EXAMPLE 2 (extract tenant from hierarchy)
# Multi-environment: Use EXAMPLE 2 (extract service from env.service)
# Legacy systems: Use EXAMPLE 3 (custom tag key)
# Complex orgs: Use EXAMPLE 5 (preserve full paths)
