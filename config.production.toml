# Stats Service Production Configuration

[server]
# HTTP REST API configuration
http_host = "0.0.0.0"
http_port = 7000

# Arrow Flight gRPC configuration
flight_host = "0.0.0.0"
flight_port = 7001

[storage]
# Production data directory (use SSD/NVMe for best performance)
data_dir = "/data0/data"

# System directory name for metadata
system_dir = "_system"

[cache]
# Flush every 30 seconds
flush_interval_secs = 30

# 2GB cache before forcing flush
max_size_mb = 2048

[compaction]
# Trigger compaction with 10+ files
min_files = 10

# Compact files larger than 200MB
max_file_size_mb = 200

# Target 1GB files after compaction
target_file_size_mb = 1024

# Maximum 7 compaction levels
max_level = 7

[series_tracker]
# Flush series stats every 60 seconds
flush_interval_secs = 60

# Series stats directory name
stats_dir = "series_stats"
